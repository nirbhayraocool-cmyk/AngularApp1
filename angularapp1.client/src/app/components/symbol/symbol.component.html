<svg viewBox="0 0 100 100" aria-hidden="true">
  @switch (name) {
  @case ('ring')     {
  <use href="#ring" /> }
  @case ('necklace') {
  <use href="#necklace" /> }
  @case ('earring')  {
  <use href="#earring" /> }
  @case ('bangle')   {
  <use href="#bangle" /> }
  @case ('diamond')  {
  <use href="#diamond" /> }
  @case ('pendant')  {
  <use href="#pendant" /> }
  }
</svg>
