<article class="card">
  <div class="photo" [style.--a]="colors?.a" [style.--b]="colors?.b">
    @if (product.image) {
    <img [src]="product.image" [alt]="product.name" (error)="product.image = undefined">
    } @else {
    <app-symbol [name]="product.symbol"></app-symbol>
    }
    <button class="heart" [class.on]="wishlist.has(product.id)"
            (click)="wishlist.toggle(product.id)" aria-label="Save">
      ♥
    </button>
  </div>
  <div class="info">
    <p class="cat">{{ product.category }} · {{ product.metal }}</p>
    <h3>{{ product.name }}</h3>
    <p class="weight">{{ product.weight }} g</p>
    <p class="price">{{ product.price | currency:'INR':'symbol':'1.0-0' }}</p>
    <a class="btn" [href]="whatsappLink" target="_blank" rel="noopener">Enquire on WhatsApp</a>
  </div>
</article>
