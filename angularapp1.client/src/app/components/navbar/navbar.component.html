<header class="nav" [class.open]="open">
  <a routerLink="/" class="brand" (click)="close()">◆ {{ shopName }}</a>
  <button class="mb" (click)="toggle()" aria-label="Menu">{{ open ? '✕' : '☰' }}</button>
  <nav (click)="close()">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
    <a routerLink="/products" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Collection</a>
    <a routerLink="/location" routerLinkActive="active">Visit Us</a>
    <a routerLink="/products" [queryParams]="{ cat: 'Saved' }" routerLinkActive="active">♥ Saved <span class="count">{{ wishlist.count() }}</span></a>
  </nav>
</header>
